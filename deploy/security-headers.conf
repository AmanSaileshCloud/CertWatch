# CERTWatch — response headers applied to every served location.
#
# Included (not inherited) into each location that sets its own add_header:
# nginx's add_header does NOT merge across levels — a location with any
# add_header of its own drops every header set by its parent. So this file is
# `include`d at server level AND again inside any location that adds headers.
#
# Strict-Transport-Security is listed unconditionally: browsers ignore it over
# plain HTTP, so it is inert until certbot converts this site to HTTPS, at
# which point it starts working with no further edit.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# The API is JSON-only and the SPA ships hashed local assets — nothing here
# loads third-party script, frames anything, or is meant to be framed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
