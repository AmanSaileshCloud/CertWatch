# CERTWatch — single-server Nginx site.
# Serves the built React SPA and reverse-proxies the API to uvicorn on :8000.
# Same origin → no CORS.
#
# This file is the pre-TLS state. Run certbot to obtain a certificate and
# convert this server block to HTTPS with an HTTP→HTTPS redirect (see the
# "Enable HTTPS" section of DEPLOY.md):
#
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d certwatch.yourcompany.com --redirect
#
# Do that before letting anyone log in: over plain HTTP the login password and
# the bearer token are readable by anything on the path.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/certwatch/app/frontend/dist;
    index index.html;

    # Modest upload cap; the bulk-import payload is tiny.
    client_max_body_size 1m;

    include /etc/nginx/snippets/certwatch-security-headers.conf;

    # Don't advertise the exact nginx version on responses or error pages.
    server_tokens off;

    # API routes → uvicorn. These are the only prefixes the backend owns.
    # Adding a new API router? Add its prefix here too —
    # tests/unit/test_deploy_config.py fails until you do.
    location ~ ^/(auth|admin|domains|checks|health|customers|groups|monitors|alerts|alert-rules|settings|reports)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed static assets — safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Re-included: this location's own add_header would otherwise discard
        # every server-level header (see the snippet's comment).
        include /etc/nginx/snippets/certwatch-security-headers.conf;
    }

    # SPA fallback: any other path returns index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
